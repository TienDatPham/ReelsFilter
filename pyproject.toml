[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelsfilter"
version = "0.1.0"
description = "Auto-categorize Facebook Saved Reels using Ollama + Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ollama>=0.3",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
reelsfilter = "reelsfilter.__main__:main"
